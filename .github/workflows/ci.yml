name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov PyYAML
          pip install -e .

      - name: Run unit tests with pytest & coverage
        run: |
          pytest --cov=commit_scope_lint --cov-report=term-missing --cov-fail-under=85

      - name: Verify CLI execution
        run: |
          commit-scope-lint --version
          commit-scope-lint "feat(core): implement initial commit scope linter"
          commit-scope-lint --help
